
<style>
#karatel-loading {
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: #090909;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  transition: opacity .6s;
}

.loading-content {
  width: 85%;
  max-width: 380px;
  text-align: center;
}

.loading-logo {
  color: #ff7900;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.loading-emoji {
  font-size: 42px;
  margin: 25px 0;
  animation: bounce 1s infinite;
}

.loading-title {
  font-size: 18px;
  font-weight: bold;
}

.loading-text {
  color: #aaa;
  font-size: 14px;
  margin: 15px 0;
}

.loading-bar {
  width: 100%;
  height: 9px;
  background: #292929;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 25px;
}

.loading-progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#ff5100,#ffb000);
  border-radius: 20px;
  transition: width .2s;
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
</style>

<div id="karatel-loading">
  <div class="loading-content">
    <div class="loading-logo">KARATEL TEST</div>

    <div class="loading-title">
      Добро пожаловать на форум!
    </div>

    <div class="loading-emoji" id="loadingEmoji">
      🚗
    </div>

    <div class="loading-text" id="loadingText">
      Подключаемся к серверу...
    </div>

    <div class="loading-bar">
      <div class="loading-progress" id="loadingProgress"></div>
    </div>

    <p style="color:#ff7900;font-size:13px">
      BLACK RUSSIA STYLE
    </p>
  </div>
</div>

<script>
(function() {
  const emojis = ["🚗","🏙️","🔥","🎮","🏎️","⭐","🌆","🚀"];
  const messages = [
    "Подключаемся к серверу...",
    "Загружаем форум...",
    "Проверяем аккаунт...",
    "Загружаем профили игроков...",
    "Почти готово..."
  ];

  const progress = document.getElementById("loadingProgress");
  const emoji = document.getElementById("loadingEmoji");
  const text = document.getElementById("loadingText");
  const screen = document.getElementById("karatel-loading");

  let value = 0;

  const timer = setInterval(() => {
    value += Math.floor(Math.random() * 8) + 3;

    if (value > 100) value = 100;

    progress.style.width = value + "%";

    emoji.textContent =
      emojis[Math.floor(Math.random() * emojis.length)];

    text.textContent =
      messages[Math.min(4, Math.floor(value / 21))];

    if (value >= 100) {
      clearInterval(timer);

      text.textContent = "Форум готов! Добро пожаловать!";

      setTimeout(() => {
        screen.style.opacity = "0";

        setTimeout(() => {
          screen.remove();

          const forum = document.getElementById("forum");
          if (forum) forum.scrollIntoView();
        }, 600);
      }, 700);
    }
  }, 250);
})();
</script>
