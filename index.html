<script>
const $ = id => document.getElementById(id);

let currentNick = "";

function page(name) {
 $("home").style.display = name === "home" ? "block" : "none";
 $("forum").style.display = name === "forum" ? "block" : "none";
 $("auth").style.display = name === "auth" ? "block" : "none";
}

function enter() {
 const nick = $("nick").value.trim();

 if (!nick) {
  $("msg").textContent = "Введите ник!";
  return;
 }

 currentNick = nick;
 showProfile();
}

function register() {
 const nick = $("nick").value.trim();

 if (!nick) {
  $("msg").textContent = "Сначала введите ник!";
  return;
 }

 currentNick = nick;
 showProfile();
}

function showProfile() {
 $("playerNick").textContent = currentNick;

 const isDeveloper =
  currentNick.toLowerCase() === "wells_ohhotnik";

 $("rank").textContent = isDeveloper
  ? "👑 Главный разработчик"
  : "🎮 Игрок";

 $("developer").style.display =
  isDeveloper ? "block" : "none";

 $("profile").style.display = "block";
 $("loginNav").style.display = "none";
 $("logoutNav").classList.remove("hidden");

 $("auth").style.display = "none";
 page("home");
}

function logout() {
 currentNick = "";
 $("profile").style.display = "none";
 $("developer").style.display = "none";
 $("loginNav").style.display = "inline-block";
 $("logoutNav").classList.add("hidden");
 page("home");
}

// Экран загрузки
const emojis = ["🚗","🏙️","🔥","🎮","🏎️","⭐"];
let progress = 0;

const timer = setInterval(() => {
 progress += 5;

 $("progress").style.width = progress + "%";
 $("emoji").textContent =
  emojis[Math.floor(Math.random() * emojis.length)];

 if (progress >= 100) {
  clearInterval(timer);

  $("loading").style.opacity = "0";

  setTimeout(() => {
   $("loading").remove();
  }, 500);
 }
}, 100);
</script>
